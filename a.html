  <style>
    html,body{min-height:100%;background:#eaf4ff}
    body.vh-100{height:auto!important;min-height:100vh}
    .go7-page{min-height:100vh;display:flex;flex-direction:column;background:
      radial-gradient(circle at 75% 25%,rgba(102,158,243,.18),transparent 28%),
      radial-gradient(circle at 8% 75%,rgba(80,145,239,.15),transparent 30%),
      linear-gradient(180deg,#fbfdff 0%,#f1f7ff 47%,#e5f1ff 100%)}
    .go7-hero{position:relative;overflow:hidden;flex:1;display:flex;align-items:center;background:transparent}
    .go7-hero-inner{position:relative;z-index:2;width:100%;padding:28px 0 26px}
    .go7-copy{position:relative;z-index:5;padding-left:8px}
    .go7-welcome{margin:0 0 14px;color:#1768df;font-size:21px;line-height:1.2;font-weight:600}
    .go7-title{margin:0;color:#10264b;font-size:clamp(48px,5vw,72px);line-height:.99;letter-spacing:-3.2px;font-weight:800}
    .go7-title .dot-in{color:#286fe9}
    .go7-subtitle{margin:23px 0 0;color:#607598;font-size:28px;line-height:1.25;font-weight:500;letter-spacing:-.3px}
    .go7-description{max-width:560px;margin:18px 0 0;color:#627796;font-size:18px;line-height:1.55}
    .go7-cta{display:inline-flex;align-items:center;gap:18px;margin-top:28px;padding:13px 14px 13px 29px;border-radius:50px;background:linear-gradient(135deg,#3a89ff,#1755d5);color:#fff!important;text-decoration:none!important;font-size:16px;font-weight:700;box-shadow:0 17px 35px rgba(37,99,235,.28);transition:.2s}
    .go7-cta:hover{transform:translateY(-2px);color:#fff!important}
    .go7-arrow{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.17);font-size:27px}
    .go7-art{width:100%;margin-left:auto}
    .go7-art svg{display:block;width:100%;height:auto;overflow:visible}
    /* Keep footer visually continuous with hero; no separate white strip. */
    .go7-footer-wrap{background:transparent!important}
    .go7-footer-wrap .footer{background:transparent!important}
    @media(max-width:991px){.go7-hero{min-height:auto}.go7-hero-inner{padding:42px 0 45px}.go7-art{margin-top:34px}}
    @media(max-width:575px){.go7-title{font-size:42px;letter-spacing:-1.7px}.go7-subtitle{font-size:21px}.go7-description{font-size:16px}}
  </style>
