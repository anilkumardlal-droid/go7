<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECROWS Domain Transfer Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#FCFCFC;font-family:"Nunito",sans-serif}

.banner{
  width:700px;height:90px;margin:0 auto;position:relative;overflow:hidden;
  border:1px solid #e2e6ef;border-radius:14px;
  background:linear-gradient(105deg,#FCFCFC 0%,#fff 55%,#F3F7FF 100%);
}
.banner:before{
  content:"";position:absolute;right:-75px;top:-115px;width:255px;height:255px;
  border:1px solid rgba(49,85,216,.09);border-radius:50%;
}
.banner:after{
  content:"";position:absolute;right:24px;bottom:10px;width:105px;height:32px;
  border-top:1px solid rgba(49,85,216,.10);border-radius:50%;transform:rotate(-12deg);
}

.inner{
  position:relative;z-index:2;height:100%;display:flex;align-items:center;padding:0 18px;
}

/* ECROWS — continuous, very subtle live shine */
.ecrows{width:205px;flex:none;display:flex;align-items:center;gap:10px}
.ecrows-mark{
  width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
  background:#3155D8;color:#fff;font-size:14px;font-weight:800;letter-spacing:-.5px;
}
.ecrows-name{
  font-size:18px;line-height:20px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(110deg,#172033 20%,#3155D8 38%,#172033 55%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:textShine 4s linear infinite;
}
.ecrows-name small{
  display:block;margin-top:3px;color:#7d8797;font-size:7px;line-height:8px;
  font-weight:600;letter-spacing:1px;text-transform:uppercase;
  background:none;-webkit-text-fill-color:#7d8797;
}

/* Main text — live highlight */
.message{
  width:220px;flex:none;padding-left:15px;border-left:1px solid #dce2eb;
}
.title{
  font-size:20px;line-height:22px;font-weight:800;letter-spacing:-.7px;white-space:nowrap;
  background:linear-gradient(105deg,#172033 0%,#172033 35%,#3155D8 48%,#172033 61%,#172033 100%);
  background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShine 3.8s ease-in-out infinite;
}
.subtitle{
  margin-top:4px;color:#667085;font-size:9px;line-height:11px;white-space:nowrap;
  animation:softPulse 2.8s ease-in-out infinite;
}

/* Transfer visual */
.flow{
  flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;
}
.domain-box{
  min-width:65px;height:40px;padding:0 10px;display:grid;place-items:center;
  border:1px solid #dfe5ee;border-radius:10px;background:rgba(255,255,255,.88);
  color:#263348;font-size:10px;font-weight:800;
}
.domain-box.blue{color:#3155D8;background:#F0F4FF;border-color:#dce5ff}
.arrow{width:38px;height:22px;position:relative}
.arrow:before{
  content:"";position:absolute;left:0;top:9px;width:28px;height:4px;border-radius:4px;
  background:#3155D8;
  animation:arrowLive 1.5s ease-in-out infinite;
}
.arrow:after{
  content:"";position:absolute;right:0;top:4px;width:13px;height:13px;
  border-top:4px solid #3155D8;border-right:4px solid #3155D8;transform:rotate(45deg);
  animation:arrowHead 1.5s ease-in-out infinite;
}

@keyframes textShine{
  0%{background-position:220% 0}
  100%{background-position:-20% 0}
}
@keyframes titleShine{
  0%,20%{background-position:220% 0}
  55%,100%{background-position:-20% 0}
}
@keyframes softPulse{
  0%,100%{opacity:.62}
  50%{opacity:1}
}
@keyframes arrowLive{
  0%,100%{transform:translateX(0);opacity:.7}
  50%{transform:translateX(5px);opacity:1}
}
@keyframes arrowHead{
  0%,100%{transform:translateX(0) rotate(45deg)}
  50%{transform:translateX(5px) rotate(45deg)}
}

/* tablet */
@media(max-width:699px) and (min-width:481px){
 .banner{width:calc(100% - 16px);max-width:700px}
 .inner{padding:0 10px}
 .ecrows{width:150px;gap:6px}
 .ecrows-mark{width:35px;height:35px;font-size:12px}
 .ecrows-name{font-size:14px}
 .ecrows-name small{font-size:5.5px}
 .message{width:190px;padding-left:10px}
 .title{font-size:17px}
 .subtitle{font-size:7px}
 .domain-box{min-width:52px;padding:0 6px;font-size:8px}
 .arrow{width:25px}
}

/* mobile 300x250 */
@media(max-width:480px){
 .banner{width:min(300px,calc(100vw - 12px));height:250px;border-radius:17px}
 .banner:before{width:290px;height:290px;right:-150px;top:-145px}
 .inner{display:block;padding:0}
 .ecrows{position:absolute;left:20px;top:22px;width:auto}
 .ecrows-mark{width:46px;height:46px;border-radius:12px;font-size:15px}
 .ecrows-name{font-size:18px;line-height:20px}
 .ecrows-name small{font-size:6.5px}
 .message{
   position:absolute;left:20px;right:20px;top:92px;width:auto;
   padding:0 0 0 12px;border-left:3px solid #3155D8
 }
 .title{font-size:24px;line-height:27px;white-space:normal;letter-spacing:-1px}
 .subtitle{margin-top:6px;font-size:10px;line-height:14px;white-space:normal}
 .flow{
   position:absolute;left:20px;right:20px;top:170px;height:45px;justify-content:flex-start
 }
 .domain-box{flex:1;min-width:0;height:42px;font-size:10px}
 .arrow{flex:0 0 30px}
}
@media(max-width:315px){
 .banner{width:calc(100vw - 8px)}
 .ecrows{left:6.5%}.message{left:6.5%;right:6.5%}.flow{left:6.5%;right:6.5%}
}
@media(prefers-reduced-motion:reduce){
 .ecrows-name,.title,.subtitle,.arrow:before,.arrow:after{animation:none}
}
</style>
</head>
<body>
<div class="banner">
  <div class="inner">
    <div class="ecrows">
      <div class="ecrows-mark">EC</div>
      <div class="ecrows-name">[ECROWS]
        <small>Domain Transfer</small>
      </div>
    </div>
    <div class="message">
      <div class="title">Domain <span>Transfer</span></div>
      <div class="subtitle">Fast • Secure • Hassle-Free</div>
    </div>
    <div class="flow">
      <div class="domain-box">DOMAIN</div>
      <div class="arrow"></div>
      <div class="domain-box blue">TRANSFER</div>
    </div>
  </div>
</div>
</body>
</html>
