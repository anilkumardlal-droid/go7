<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GO7.IN - Premium .IN Domain Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GO7.IN is a premium .IN domain portfolio featuring short, memorable and brandable domains." />
    <meta name="keywords" content="GO7.IN, premium .IN domains, domain portfolio, brandable domains" />
    <meta content="Anil Srivastav" name="author" />

    <link rel="shortcut icon" href="images/favicon.png" />
    <link rel="stylesheet" type="text/css" href="css/animate.min.css" />
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="css/materialdesignicons.min.css" rel="stylesheet" type="text/css" />
    <link href="css/style.min.css" rel="stylesheet" type="text/css" />
    <link href="css/home.css" rel="stylesheet" type="text/css" />
    <link rel="canonical" href="https://www.go7.in/" />
  </head>

  <body class="vh-100">

    <!-- Header -->
    <div class="header">
      <div class="container">
        <nav class="navbar navbar-expand-md navbar-light p-0">
          <a class="navbar-brand" href="index.html">
            <img src="images/logo-go7domain.png" alt="GO7.IN" height="44">
          </a>
          <div class="collapse navbar-collapse justify-content-end" id="mainMenu"></div>
        </nav>
      </div>
    </div>

    <!-- Homepage Hero -->
    <div class="contain-box go7-content-loading" id="go7Content">
      <div class="home-center">
        <div class="home-desc-center">
          <div class="container">
            <div class="row justify-content-center">
              <div class="col-lg-10">
                <div class="go7-hero text-center">

                  <div class="go7-label">
                    <span class="go7-dot"></span>
                    Premium .IN Domains
                  </div>

                  <h1>Premium .IN Domain Portfolio</h1>

                  <p>Short. Memorable. Brandable.</p>

                  <a href="https://www.hostinger.com/#pricing" class="go7-btn">
                    Get started
                  </a>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="float-end pull-none">
              <p class="mb-1 mt-4">
                © <script>document.write(new Date().getFullYear())</script>
                GO7.IN All Rights Reserved. |
                Powered by <a href="https://www.go7.in/">www.go7.in</a> |
                Owned & Operated by
                <a href="https://www.go7.in/about">Anil Srivastav</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Homepage UI/UX -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      body {
        background: #f8fafc;
        color: #111827;
      }

      .go7-content-loading {
        min-height: 100vh;
      }

      .go7-hero {
        position: relative;
        padding: 40px 24px;
        overflow: hidden;
      }

      .go7-hero::before,
      .go7-hero::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: #eef2f7;
        z-index: 0;
        pointer-events: none;
      }

      .go7-hero::before {
        top: -230px;
        left: -250px;
      }

      .go7-hero::after {
        right: -250px;
        bottom: -230px;
      }

      .go7-hero > * {
        position: relative;
        z-index: 1;
      }

      .go7-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding: 7px 13px;
        border: 1px solid #e5e7eb;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        color: #6b7280;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2px;
      }

      .go7-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #111827;
        display: inline-block;
      }

      .go7-hero h1 {
        margin: 0;
        color: #111827;
        font-size: clamp(42px, 6.2vw, 76px);
        line-height: 1.04;
        font-weight: 650;
        letter-spacing: -2.8px;
      }

      .go7-hero p {
        margin: 20px 0 34px;
        color: #6b7280;
        font-size: 18px;
        line-height: 1.6;
        letter-spacing: 0.1px;
      }

      .go7-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 142px;
        height: 48px;
        padding: 0 24px;
        border-radius: 8px;
        background: #111827;
        color: #fff !important;
        text-decoration: none !important;
        font-size: 15px;
        font-weight: 600;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .go7-btn:hover {
        background: #000;
        transform: translateY(-1px);
      }

      @media (max-width: 576px) {
        .go7-hero {
          padding: 30px 20px;
        }

        .go7-label {
          margin-bottom: 20px;
        }

        .go7-hero h1 {
          letter-spacing: -1.8px;
        }

        .go7-hero p {
          font-size: 16px;
          margin: 17px 0 28px;
        }
      }
    </style>

    <!-- javascript -->
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery.easing.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/custom.js"></script>
    <script src="js/tawk.js"></script>

  </body>
</html>
