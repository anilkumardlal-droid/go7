  <style>
    /* Only the hero is styled here. Existing header/footer remain untouched. */
    .go7-hero{
      position:relative;
      overflow:hidden;
      min-height:calc(100vh - 100px);
      display:flex;
      align-items:center;
      background:
        radial-gradient(circle at 72% 28%,rgba(100,157,245,.20),transparent 28%),
        radial-gradient(circle at 8% 82%,rgba(86,151,241,.14),transparent 28%),
        linear-gradient(180deg,#fbfdff 0%,#f1f7ff 48%,#e7f2ff 100%);
    }
    .go7-hero-inner{
      position:relative;
      z-index:2;
      width:100%;
      padding:34px 0 30px;
    }
    .go7-copy{
      position:relative;
      z-index:5;
      padding-left:8px;
    }
    .go7-welcome{
      margin:0 0 14px;
      color:#1768df;
      font-size:21px;
      line-height:1.2;
      font-weight:600;
    }
    .go7-title{
      margin:0;
      color:#10264b;
      font-size:clamp(48px,5.15vw,73px);
      line-height:.99;
      letter-spacing:-3.4px;
      font-weight:800;
    }
    .go7-title .dot-in{
      color:#276de9;
    }
    .go7-subtitle{
      margin:24px 0 0;
      color:#607598;
      font-size:29px;
      line-height:1.25;
      letter-spacing:-.4px;
      font-weight:500;
    }
    .go7-description{
      max-width:570px;
      margin:18px 0 0;
      color:#627796;
      font-size:18px;
      line-height:1.55;
    }
    .go7-cta{
      display:inline-flex;
      align-items:center;
      gap:18px;
      margin-top:29px;
      padding:13px 14px 13px 29px;
      border-radius:50px;
      background:linear-gradient(135deg,#3b89ff 0%,#1755d6 100%);
      color:#fff!important;
      text-decoration:none!important;
      font-size:16px;
      font-weight:700;
      box-shadow:0 17px 35px rgba(37,99,235,.28);
      transition:transform .2s ease,box-shadow .2s ease;
    }
    .go7-cta:hover{
      color:#fff!important;
      transform:translateY(-2px);
      box-shadow:0 21px 40px rgba(37,99,235,.34);
    }
    .go7-arrow{
      width:42px;
      height:42px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:rgba(255,255,255,.17);
      font-size:27px;
      line-height:1;
    }
    .go7-art{
      position:relative;
      width:100%;
      margin-left:auto;
    }
    .go7-art svg{
      display:block;
      width:100%;
      height:auto;
      overflow:visible;
    }
    @media(max-width:991px){
      .go7-hero{min-height:auto}
      .go7-hero-inner{padding:42px 0 50px}
      .go7-art{margin-top:35px}
    }
    @media(max-width:575px){
      .go7-title{font-size:43px;letter-spacing:-2px}
      .go7-subtitle{font-size:22px}
      .go7-description{font-size:16px}
      .go7-cta{font-size:15px}
