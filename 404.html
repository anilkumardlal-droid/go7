<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | GO7</title>

<meta http-equiv="refresh" content="8;url=/">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    color:#fff;
    font-family:Inter,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    max-width:600px;
    padding:30px;
}

h1{
    font-size:72px;
    font-weight:600;
    margin-bottom:10px;
}

h2{
    font-size:28px;
    margin-bottom:15px;
}

p{
    color:#aaa;
    line-height:1.8;
}

.countdown{
    margin-top:20px;
    font-size:18px;
    color:#fff;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    border:1px solid #fff;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
}
</style>
</head>
<body>

<div class="container">
    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        The page you are looking for does not exist or has been moved.
    </p>

    <div class="countdown">
        Redirecting to homepage in <span id="timer">8</span> seconds...
    </div>

    <a href="/" class="btn">Go Home</a>
</div>

<script>
let time = 8;

setInterval(() => {
    time--;
    document.getElementById("timer").innerText = time;

    if(time <= 0){
        window.location.href = "/";
    }
},1000);
</script>

</body>
</html>
