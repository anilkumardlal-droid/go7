<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | GO7</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#F8F9FA;
    color:#2D3748;
    font-family:"Nunito",sans-serif;
    font-size:16px;
    line-height:1.7;
    padding:80px 20px 40px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    font-size:clamp(70px,11vw,110px);
    font-weight:700;
    line-height:1;
    letter-spacing:-4px;
    margin-bottom:16px;

    background:linear-gradient(
        90deg,
        #0EA5E9 0%,
        #38BDF8 50%,
        #0EA5E9 100%
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}

h2{
    font-size:clamp(30px,4vw,38px);
    font-weight:700;
    color:#1E293B;
    margin-bottom:22px;
}

p{
    color:#64748B;
    font-size:18px;
    margin-bottom:20px;
}

#timer{
    font-size:24px;
    font-weight:700;
    color:#0EA5E9;
}

/* Home Page Button */
.btn{
    display:inline-block;
    padding:12px 26px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    text-decoration:none;
    border:1px solid transparent;
    transition:.25s ease;
    border-radius:5px;
}

.btn:focus{
    outline:none;
    box-shadow:none;
}

.btn-primary{
    background:#3850D5 !important;
    border-color:#3850D5 !important;
    color:#fff !important;
}

.btn-primary:hover,
.btn-primary:focus,
.btn-primary:active,
.btn-primary.active,
.btn-primary.focus,
.btn-primary:not(:disabled):not(.disabled):active,
.btn-primary:not(:disabled):not(.disabled):active:focus{
    background:#2B44CD !important;
    border-color:#2B44CD !important;
    color:#fff !important;
}

@media (max-width:768px){

    body{
        padding:50px 18px 30px;
    }

    .container{
        max-width:100%;
    }

    h1{
        font-size:52px;
    }

    h2{
        font-size:28px;
    }

    p{
        font-size:17px;
    }

    #timer{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1 aria-label="404">404</h1>

    <h2>Oops! This page doesn't exist.</h2>

    <p>
The page you're looking for may have been moved, deleted, or never existed.
</p>

<p>
Return to the GO7 homepage to continue browsing.
You will be redirected automatically in
<strong><span id="timer">8</span></strong> seconds.
</p>

    <a href="/" class="btn btn-primary">GO TO HOMEPAGE</a>

</div>

<script>
let time = 8;
const timer = document.getElementById("timer");

const countdown = setInterval(() => {
    time--;
    timer.textContent = time;

    if (time <= 0) {
        clearInterval(countdown);
        window.location.href = "/";
    }
}, 1000);
</script>

</body>
</html>
