```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<style>

/* BBH Bartle Font */
@font-face {
    font-family: "BBH Bartle";
    src: url("/assets/fonts/BBHBartle-Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Body */
body {
    background: #FCFCFC;
    color: #0D0D0D;
    font-family: "BBH Bartle", sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.6;
}

/* Main */
main {
    padding: 38px 32px;
}

/* 404 */
h1 {
    font-family: "BBH Bartle", sans-serif;
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 15px;
}

/* Heading */
h2 {
    font-family: "BBH Bartle", sans-serif;
    font-size: 40px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
}

/* Paragraph */
p {
    width: 100%;
    color: #666666;
    font-family: "BBH Bartle", sans-serif;
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 10px;
    line-height: 1.5;
}

/* Countdown */
#countdown {
    color: #0D0D0D;
    font-weight: 400;
}

/* Mobile Responsive */
@media (max-width: 768px) {

    main {
        padding: 32px 20px;
    }

    h2 {
        font-size: 32px;
    }

    p {
        font-size: 14px;
    }

}

</style>

<script>

let seconds = 10;
let countdownTimer;

function updateCountdown() {

    const countdown = document.getElementById("countdown");

    if (!countdown) return;

    countdown.textContent = seconds;

    if (seconds <= 0) {
        clearInterval(countdownTimer);
        window.location.replace("/");
        return;
    }

    seconds--;

}

window.addEventListener("load", function () {

    updateCountdown();

    countdownTimer = setInterval(updateCountdown, 1000);

});

</script>

</head>

<body>

<main>

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        The page you're looking for doesn't exist, may have been moved, or the URL is incorrect.
    </p>

    <p>
        Redirecting to the homepage in
        <span id="countdown">10</span> seconds.
    </p>

</main>

</body>
</html>
