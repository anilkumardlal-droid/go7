<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | GO7</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#F8F9FA url("images/overlay-2.png") center center no-repeat;
    color:#1E3547;
    font-family:"Nunito",sans-serif;
    font-size:16px;
    line-height:1.6;
    padding:70px 20px 40px;
}

.container{
    max-width:680px;
    margin:0 auto;
}

h1{
    font-family:"Nunito",sans-serif;
    font-size:clamp(64px,10vw,90px);
    font-weight:700;
    line-height:1;
    letter-spacing:-3px;
    margin-bottom:12px;
    background:linear-gradient(180deg,#FEA64D 0%,#FE872D 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:0 2px 8px rgba(254,135,45,.15);
}

h2{
    font-family:"Nunito",sans-serif;
    font-size:clamp(26px,4vw,34px);
    font-weight:700;
    color:#1E3547;
    margin-bottom:20px;
}

p{
    font-size:18px;
    line-height:1.6;
    color:#828F99;
    margin-bottom:18px;
}

#timer{
    font-size:24px;
    font-weight:700;
    color:#3850D5;
}

/* Home Page Button */
.btn{
    display:inline-block;
    padding:12px 26px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.5px;
    text-decoration:none;
    border:1px solid transparent;
    transition:.25s ease;
    border-radius:5px;
}

.btn:focus{
    outline:none;
    box-shadow:none;
}

.btn-primary{
    background:#3850D5 !important;
    border-color:#3850D5 !important;
    color:#fff !important;
}

.btn-primary:hover,
.btn-primary:focus,
.btn-primary:active,
.btn-primary.active,
.btn-primary.focus,
.btn-primary:not(:disabled):not(.disabled):active,
.btn-primary:not(:disabled):not(.disabled):active:focus{
    background:#2B44CD !important;
    border-color:#2B44CD !important;
    color:#fff !important;
}

@media (max-width:768px){

    body{
        padding:50px 18px 30px;
    }

    .container{
        max-width:100%;
    }

    h1{
        font-size:52px;
    }

    h2{
        font-size:28px;
    }

    p{
        font-size:17px;
    }

    #timer{
        font-size:22px;
    }
}
</style>
</head>
<body>

<div class="container">

    <h1 aria-label="404">404</h1>

    <h2>Page Not Found</h2>

    <p>
        The page you are trying to access could not be found. It may have been moved, deleted,
        or the web address may have been entered incorrectly.
    </p>

    <p>
        Please return to the GO7 homepage to continue browsing. You will be redirected
        automatically in <span id="timer">8</span> seconds.
    </p>

    <a href="/" class="btn btn-primary">Go to Homepage</a>

</div>

<script>
let time = 8;
const timer = document.getElementById("timer");

const countdown = setInterval(() => {
    time--;
    timer.textContent = time;

    if (time <= 0) {
        clearInterval(countdown);
        window.location.href = "/";
    }
}, 1000);
</script>

</body>
</html>
