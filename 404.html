<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#FCFCFC;
    color:#0D0D0D;
    font-family: "Nunito", sans-serif;
    font-size:16px;
    line-height:1.6;
}

main{
    padding:38px 32px;
}

h1{
    font-size:18px;
    font-weight:600;
    margin-bottom:15px;
}

h2{
    font-size:40px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:-0.02em;
    margin-bottom:16px;
}

p{
    p{
    width:100%;
    color:#666;
    margin-bottom:10px;
    line-height:1.3;
}


#countdown{
    color:#0D0D0D;
    font-weight:600;
}

@media (max-width:768px){

main{
    padding:32px 20px;
}

h2{
    font-size:32px;
}

}
</style>

<script>
let seconds = 10;

function updateCountdown() {
    document.getElementById("countdown").textContent = seconds;

    if (seconds <= 0) {
        window.location.replace("/");
    }

    seconds--;
}

window.onload = function () {
    updateCountdown();
    setInterval(updateCountdown, 1000);
};
</script>

</head>
<body>

<main>

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
The page you're looking for doesn't exist, may have been moved, or the URL is incorrect.
</p>

<p>
Redirecting to the homepage in
<span id="countdown">10</span> seconds.
</p>

</main>

</body>
</html>
