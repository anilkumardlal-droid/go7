<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | GO7</title>

<meta http-equiv="refresh" content="8;url=/">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#F8F9FA;
    color:#111827;
    font-family:Inter,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
}

.container{
    max-width:600px;
    padding:40px;
    background:#FFFFFF;
    border:1px solid #E5E7EB;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h1{
    font-size:72px;
    font-weight:700;
    color:#10A6BA;
    margin-bottom:10px;
}

h2{
    font-size:28px;
    color:#111827;
    margin-bottom:15px;
}

p{
    color:#6B7280;
    line-height:1.8;
}

.countdown{
    margin-top:20px;
    font-size:18px;
    color:#111827;
}

#timer{
    color:#10A6BA;
    font-weight:700;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 24px;
    background:#10A6BA;
    color:#FFFFFF;
    text-decoration:none;
    border-radius:8px;
    font-weight:600;
    transition:.25s ease;
}

.btn:hover{
    background:#0D8FA1;
}
</style>
</head>
<body>

<div class="container">
    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        The page you are looking for does not exist or has been moved.
    </p>

    <div class="countdown">
        Redirecting to homepage in <span id="timer">8</span> seconds...
    </div>

    <a href="/" class="btn">Go Home</a>
</div>

<script>
let time = 8;

setInterval(() => {
    time--;
    document.getElementById("timer").innerText = time;

    if(time <= 0){
        window.location.href = "/";
    }
},1000);
</script>

</body>
</html>
