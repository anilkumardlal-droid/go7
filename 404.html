<a href="/"
style="
display:inline-block;
margin-top:20px;
padding:14px 28px;
background:#3850D5;
color:#ffffff;
text-decoration:none;
border-radius:10px;
font-weight:600;
font-size:15px;
transition:.25s;
">
Go to Homepage
</a>

<script>

let seconds = 10;

const countdown = document.getElementById("countdown");

const timer = setInterval(() => {

seconds = Math.max(0, seconds - 1);

if (countdown) {
countdown.textContent = seconds;
const plural = document.getElementById("plural");

if (plural) {
    plural.style.display = seconds === 1 ? "none" : "";
}
}

if (seconds <= 0) {

clearInterval(timer);

window.location.replace("/");

}

},1000);

</script>
