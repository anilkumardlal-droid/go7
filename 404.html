<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | GO7.IN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#3850D5;
    --primary-hover:#2B44CD;
    --text:#1E293B;
    --muted:#64748B;
    --card:#FFFFFF;
    --shadow:0 0 50px rgba(0,0,0,.05);
}

body{
    font-family:"Nunito",sans-serif;
    background:#FCFCFC;
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.wrapper{
    width:100%;
    max-width:620px;
}

.card{
    background:#FFFFFF;
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:48px 38px;
    text-align:center;
}

.error{
    font-size:92px;
    font-weight:700;
    line-height:1;
    letter-spacing:-3px;

    background:linear-gradient(
        90deg,
        #3850D5,
        #0EA5E9,
        #3850D5
    );

    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 6s linear infinite;
}

@keyframes shine{

    from{
        background-position:200%;
    }

    to{
        background-position:-200%;
    }

}

h2{
    margin-top:10px;
    font-size:30px;
    font-weight:600;
    color:#1E293B;
}

p{
    max-width:430px;
    margin:16px auto 0;
    color:#64748B;
    font-size:16px;
    line-height:1.8;
}

.countdown{
    margin-top:22px;
    color:#64748B;
    font-size:15px;
    font-weight:600;
}

#timer{
    color:#3850D5;
    font-weight:700;
}

.btn{
    display:inline-block;
    margin-top:28px;
    padding:13px 28px;
    border-radius:6px;
    background:#3850D5;
    color:#FFFFFF;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    transition:.25s ease;
}

.btn:hover{
    background:#2B44CD;
    transform:translateY(-2px);
}

.footer{
    margin-top:18px;
    text-align:center;
    color:#94A3B8;
    font-size:13px;
}

@media(max-width:768px){

    .card{
        padding:36px 24px;
    }

    .error{
        font-size:76px;
    }

    h2{
        font-size:26px;
    }

    p{
        font-size:15px;
    }

}

</style>

</head>

<body>

<div class="wrapper">

    <div class="card">

        <div class="error">404</div>

        <h2>Page Not Found</h2>

        <p>
            The page you're looking for may have been moved,
            deleted, or never existed.
        </p>

        <div class="countdown">
            Redirecting in
            <span id="timer">8</span>
            seconds
        </div>

        <a href="/" class="btn">
            GO TO HOMEPAGE
        </a>

    </div>

    <div class="footer">
        © <script>document.write(new Date().getFullYear())</script>
        GO7.IN • Premium .IN Domain
    </div>

</div>

<script>

let time = 8;

const timer = document.getElementById("timer");

const countdown = setInterval(() => {

    time--;

    timer.textContent = time;

    if(time <= 0){

        clearInterval(countdown);

        window.location.href = "/";

    }

},1000);

</script>

</body>
</html>
