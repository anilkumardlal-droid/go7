<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
          <title>404 - Page Not Found | GO7.IN</title>
            <meta name="robots"
        content="noindex,follow">
    <link rel="shortcut icon"
href="images/favicon.png">
    <!-- Bootstrap -->
       <link href="css/bootstrap.min.css"
          rel="stylesheet">
        <!-- Material Design Icons -->
    <link href="css/materialdesignicons.min.css"
 rel="stylesheet">
    <!-- Original Theme -->
       <link href="css/style.min.css"
          rel="stylesheet">
       <!-- Custom -->
     <link href="css/custom.css"
  rel="stylesheet">
</head>
 <body class="page-404">
    <main class="error-404 d-flex align-items-center justify-content-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7 text-center">
                    <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
                      <h2 class="mb-3"> Page Not Found </h2>
                        <p class="text-muted mb-4">The page you're looking for doesn't exist,<br>may have been moved, or is no longer available.</p>
                          <p class="text-muted mb-4"> Redirecting in <strong id="timer">5</strong> seconds... </p>
                            <a href="/"
                              class="btn btn-primary px-4 py-2">
                            GO TO HOMEPAGE
                        </a>
                   </div>
               </div>
           </div>
        </main>
    <footer class="footer-404 text-center pb-4">
        <small class="text-muted">
           ©
            <script>
               document.write(new Date().getFullYear());
                </script>
                  GO7.IN • Premium .IN Domain
                </small>
              </footer>
            <script>
          let time = 5;
            const timer = document.getElementById("timer");
             const countdown = setInterval(function () {
               time--;
                 timer.textContent = time;
                  if (time <= 0) {
                clearInterval(countdown);
              window.location.href = "/";
            }
        }, 1000);
    </script>
</body>

</html>
