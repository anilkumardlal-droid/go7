<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GO7.IN - Premium .IN Domain Portfolio</title>
  <meta name="description" content="GO7.IN is a curated portfolio of premium .IN domains for brands, businesses and investors.">
  <meta name="author" content="Anil Srivastav">

  <link rel="shortcut icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/animate.min.css">
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/materialdesignicons.min.css" rel="stylesheet">
  <link href="css/style.min.css" rel="stylesheet">
  <link href="css/home.css" rel="stylesheet">
  <link rel="canonical" href="https://www.go7.in/">

  <style>

    /* =========================
       GO7.IN PREMIUM HOMEPAGE
       ========================= */

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #fafbfc;
      color: #111827;
    }

    .go7-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }


    /* =========================
       HEADER
       ========================= */

    .header {
      position: relative;
      z-index: 10;
      background: rgba(250, 251, 252, 0.88);
      border-bottom: 1px solid rgba(17, 24, 39, 0.055);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header .container {
      max-width: 1120px;
    }

    .navbar {
      min-height: 74px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    .navbar-brand img {
      display: block;
      width: auto;
      height: 42px;
    }


    /* =========================
       HERO BACKGROUND
       ========================= */

    .go7-intro {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      padding: 80px 24px 90px;
    }

    /* soft background glow */

    .go7-intro::before {
      content: "";
      position: absolute;
      width: 620px;
      height: 620px;
      top: -360px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(226, 232, 240, 0.72) 0%,
          rgba(226, 232, 240, 0.30) 42%,
          rgba(226, 232, 240, 0) 72%
        );
      pointer-events: none;
    }

    .go7-intro::after {
      content: "";
      position: absolute;
      width: 720px;
      height: 420px;
      bottom: -350px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse,
          rgba(226, 232, 240, 0.50) 0%,
          rgba(226, 232, 240, 0) 70%
        );
      pointer-events: none;
    }


    /* subtle grid */

    .go7-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        linear-gradient(
          rgba(15, 23, 42, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(15, 23, 42, 0.025) 1px,
          transparent 1px
        );
      background-size: 44px 44px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          black 22%,
          black 72%,
          transparent 100%
        );

      -webkit-mask-image:
        linear-gradient(
          to bottom,
          transparent 0%,
          black 22%,
          black 72%,
          transparent 100%
        );
    }


    /* =========================
       HERO CONTENT
       ========================= */

    .go7-intro-inner {
      width: 100%;
      max-width: 920px;
      position: relative;
      z-index: 2;
      margin: 0 auto;
    }


    /* eyebrow */

    .go7-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 25px;
      padding: 8px 14px;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.70);
      color: #64748b;
      font-size: 12px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .go7-eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      display: inline-block;
    }


    /* main heading */

    .go7-intro h1 {
      margin: 0;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
      font-size: clamp(44px, 7vw, 82px);
      line-height: 1.02;
      letter-spacing: -4px;
      font-weight: 650;
      color: #111827;
    }

    .go7-heading-highlight {
      color: #475569;
    }


    /* tagline */

    .go7-tagline {
      margin: 24px 0 0;
      color: #334155;
      font-size: 21px;
      line-height: 1.55;
      font-weight: 450;
      letter-spacing: -0.15px;
    }


    /* description */

    .go7-description {
      max-width: 650px;
      margin: 17px auto 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.75;
      font-weight: 400;
    }


    /* =========================
       CTA
       ========================= */

    .go7-actions {
      margin-top: 34px;
    }

    .go7-explore {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 50px;
      padding: 0 24px;
      border-radius: 9px;
      background: #111827;
      color: #ffffff !important;
      text-decoration: none !important;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.1px;
      border: 1px solid #111827;
      transition:
        transform 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease;
    }

    .go7-explore:hover {
      background: #1f2937;
      border-color: #1f2937;
      transform: translateY(-2px);
    }

    .go7-explore i {
      font-size: 17px;
      transition: transform 0.22s ease;
    }

    .go7-explore:hover i {
      transform: translateX(3px);
    }


    /* =========================
       TRUST POINTS
       ========================= */

    .go7-trust {
      margin: 58px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0;
      max-width: 720px;
    }

    .go7-trust-item {
      padding: 0 24px;
      color: #64748b;
      font-size: 12px;
      font-weight: 550;
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .go7-trust-item + .go7-trust-item {
      border-left: 1px solid #dbe1e8;
    }



    /* =========================
       TWO-COLUMN DOMAIN HERO
       ========================= */

    .go7-hero-row{
      width:100%;
      min-height:600px;
      align-items:center;
    }

    .go7-left{
      position:relative;
      z-index:3;
      text-align:left;
      padding-right:18px;
    }

    .go7-left h1{
      margin:0;
      max-width:650px;
      font-size:clamp(44px,5vw,64px);
      line-height:1.06;
      letter-spacing:-2.8px;
      font-weight:650;
      color:#111827;
    }

    .go7-left .go7-tagline{
      margin:22px 0 0;
    }

    .go7-left .go7-description{
      margin-left:0;
      margin-right:0;
    }

    .go7-right{
      width:100%;
      min-height:600px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .go7-domain-svg{
      display:block;
      width:112%;
      max-width:760px;
      height:auto;
      margin-right:-8%;
    }

    .svg-main{
      animation:go7DomainFloat 6s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    .svg-tag{
      animation:go7TagFloat 4s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    .svg-float{
      animation:go7SmallFloat 5s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    .svg-card{
      animation:go7CardFloat 6s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    .svg-person{
      animation:go7PersonFloat 5s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    .svg-sale{
      animation:go7SalePulse 2.4s ease-in-out infinite;
      transform-box:fill-box;
      transform-origin:center;
    }

    @keyframes go7DomainFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }

    @keyframes go7TagFloat{
      0%,100%{transform:translateY(0) rotate(0)}
      50%{transform:translateY(-10px) rotate(2deg)}
    }

    @keyframes go7SmallFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-7px)}
    }

    @keyframes go7CardFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-5px)}
    }

    @keyframes go7PersonFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-5px)}
    }

    @keyframes go7SalePulse{
      0%,100%{opacity:1}
      50%{opacity:.72}
    }

    @media(max-width:991px){
      .go7-hero-row{min-height:560px}
      .go7-left h1{font-size:clamp(40px,5.5vw,56px)}
      .go7-right{min-height:560px}
      .go7-domain-svg{
        width:108%;
        max-width:650px;
        margin-right:-4%;
      }
    }

    @media(max-width:767px){
      .go7-intro{
        align-items:flex-start;
        padding:34px 20px 30px;
        overflow:visible;
      }

      .go7-hero-row{
        min-height:auto;
      }

      .go7-left{
        padding-right:0;
        text-align:center;
      }

      .go7-left h1{
        max-width:500px;
        margin:0 auto;
        font-size:clamp(38px,10vw,48px);
        line-height:1.08;
        letter-spacing:-1.7px;
      }

      .go7-left .go7-description{
        max-width:350px;
        margin:15px auto 28px;
      }

      .go7-right{
        min-height:0;
        margin-top:34px;
      }

      .go7-domain-svg{
        width:108%;
        max-width:560px;
        margin:0 -4%;
      }
    }

    @media(max-width:400px){
      .go7-left h1{
        font-size:37px;
        letter-spacing:-1.4px;
      }

      .go7-right{margin-top:26px}

      .go7-domain-svg{
        width:112%;
        margin-left:-6%;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .svg-main,.svg-tag,.svg-float,.svg-card,.svg-person,.svg-sale{
        animation:none!important;
      }
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      position: relative;
      z-index: 5;
      border-top: 1px solid rgba(17, 24, 39, 0.055);
      background: rgba(250, 251, 252, 0.80);
    }

    .footer p {
      margin: 0;
      padding: 18px 0;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.7;
      letter-spacing: 0.1px;
    }

    .footer a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: #111827;
    }


    /* =========================
       TABLET
       ========================= */

    @media (max-width: 768px) {

      .navbar {
        min-height: 68px;
      }

      .navbar-brand img {
        height: 40px;
      }

      .go7-intro {
        flex: 1 1 auto;
        min-height: 0;
        padding: 55px 22px 55px;
      }

      .go7-intro h1 {
        font-size: clamp(42px, 9vw, 64px);
        letter-spacing: -2.8px;
      }

      .go7-tagline {
        font-size: 19px;
      }

      .go7-trust {
        margin-top: 48px;
      }

      .go7-trust-item {
        padding: 0 17px;
      }

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 576px) {

      .header .container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .navbar {
        min-height: 64px;
      }

      .navbar-brand img {
        height: 38px;
      }

      .go7-page {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .go7-intro {
        flex: 1 1 auto;
        min-height: 0;
        align-items: flex-start;
        padding: 36px 20px 42px;
        overflow: visible;
      }

      .go7-eyebrow {
        margin-bottom: 21px;
        padding: 7px 12px;
        font-size: 10px;
        letter-spacing: 1.45px;
      }

      .go7-intro h1 {
        font-size: 43px;
        line-height: 1.04;
        letter-spacing: -2.2px;
      }

      .go7-tagline {
        margin-top: 20px;
        font-size: 17px;
        line-height: 1.55;
      }

      .go7-description {
        margin-top: 14px;
        font-size: 14px;
        line-height: 1.7;
      }

      .go7-actions {
        margin-top: 29px;
      }

      .go7-explore {
        width: auto;
        min-height: 48px;
        padding: 0 21px;
      }

      .go7-trust {
        margin-top: 42px;
        flex-direction: column;
        gap: 13px;
      }

      .go7-trust-item {
        padding: 0;
        font-size: 11px;
      }

      .go7-trust-item + .go7-trust-item {
        border-left: 0;
      }

      .footer p {
        padding: 15px 20px;
        font-size: 10px;
      }

    }


    /* =========================
       REDUCE MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {

      .go7-explore,
      .go7-explore i {
        transition: none;
      }

    }

  </style>
</head>
