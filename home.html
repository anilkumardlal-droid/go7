<head>  
  <meta charset="utf-8">

  <style> 
    html,body{ 
      height:100%; 
      margin:0; 
    } 
 
    body{ 
      background:#f8fafc; 
      color:#111827;
    } 
 
    .go7-intro{ 
      min-height:100vh; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      text-align:center; 
      position:relative; 
      overflow:hidden; 
      padding:40px 24px; 
    } 
 
    .go7-intro:before, 
    .go7-intro:after{ 
      content:""; 
      position:absolute; 
      width:430px; 
      height:430px; 
      border-radius:50%; 
      background:#eef2f7; 
      pointer-events:none; 
    } 
 
    .go7-intro:before{ 
      top:-250px; 
      left:-250px; 
    } 
 
    .go7-intro:after{ 
      right:-260px; 
      bottom:-260px; 
    } 
 
    .go7-intro-inner{ 
      position:relative; 
      z-index:1; 
      max-width:850px; 
    } 
 
    .welcome-text{ 
      font-size:15px; 
      font-weight:600; 
      letter-spacing:3px; 
      color:#6b7280; 
      margin-bottom:25px; 
    } 
 
    .go7-intro h1{ 
      margin:0; 
      font-size:clamp(42px,6vw,74px); 
      line-height:1.06; 
      letter-spacing:-2.8px; 
      font-weight:650; 
      color:#111827; 
    } 
 
    .go7-tagline{ 
      margin:20px 0 0; 
      color:#1e3547; 
      font-size:19px; 
      line-height:1.6; 
    } 
 
    .go7-description{ 
      max-width:620px; 
      margin:18px auto 32px; 
      color:#1e3547; 
      font-size:15px; 
      line-height:1.7; 
    } 
 
    .go7-explore{ 
      display:inline-flex; 
      align-items:center; 
      gap:8px; 
      height:48px; 
      padding:0 24px; 
      border-radius:8px; 
      background:#111827; 
      color:#fff!important; 
      text-decoration:none!important; 
      font-size:15px; 
      font-weight:600; 
      transition:.2s ease; 
    } 
 
    .go7-explore:hover{ 
      background:#000; 
      transform:translateY(-1px); 
    } 
 
    .go7-explore i{ 
      font-size:17px; 
    } 
 
    @media(max-width:576px){ 
  .welcome-text{ 
    font-size:13px; 
    letter-spacing:2px; 
    margin-bottom:20px; 
  } 
 
  .go7-intro h1{ 
    font-size:42px; 
    letter-spacing:-1.8px; 
  } 
 
  .go7-tagline{ 
    font-size:17px; 
  } 
 
  .go7-description{ 
    font-size:14px; 
  } 
} 
  </style> 
</head>

      <div>Welcome to</div>

      <p class="go7-tagline"> 
        Short. Memorable. Brandable. 
      </p> 
 
      <p class="go7-description"> 
        A curated portfolio of premium .IN domains for brands, 
        businesses and investors. 
      </p> 
 
      <a href="/domains" class="go7-explore"> 
        Explore Domains 
        <i class="mdi mdi-arrow-right"></i> 
      </a> 
 
    </div> 
  </main>

            </p> 
          </div> 
        </div> 
      </div> 
    </div> 
  </div>
