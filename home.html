    <!-- GO7 Hero Layout + SVG Effects
         NOTE:
         No font-family / font-color CSS is added here.
         Fonts remain controlled by home.css / style.min.css.
    -->
    <style>

        /* ================================
           HERO LAYOUT
        ================================= */

        .go7-home {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            padding: 45px 0 40px;
            overflow: hidden;
        }

        .go7-home-row {
            align-items: center;
        }


        /* ================================
           LEFT SIDE
        ================================= */

        .go7-left {
            position: relative;
            z-index: 5;
        }

        .go7-left .go7-description {
            max-width: 610px;
        }

        .go7-left .go7-explore {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }


        /* ================================
           RIGHT SIDE
        ================================= */

        .go7-right {
            position: relative;
            width: 100%;
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .go7-svg-art {
            width: 100%;
            max-width: 790px;
            height: auto;
            display: block;
        }


        /* ================================
           SVG ANIMATIONS
        ================================= */

        .go7-float {
            animation: go7Float 5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .go7-float-slow {
            animation: go7FloatSlow 7s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .go7-tag-float {
            animation: go7TagFloat 4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .go7-pulse {
            animation: go7Pulse 2.5s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .go7-dots {
            animation: go7Dots 5s ease-in-out infinite;
        }

        .go7-bar-1 {
            animation: go7Bar1 2.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }

        .go7-bar-2 {
            animation: go7Bar2 2.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }

        .go7-bar-3 {
            animation: go7Bar3 2.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }

        .go7-bar-4 {
            animation: go7Bar4 2.5s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: bottom;
        }


        @keyframes go7Float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-9px);
            }
        }


        @keyframes go7FloatSlow {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-7px) scale(1.015);
            }
        }


        @keyframes go7TagFloat {

            0%,
            100% {
                transform: rotate(-10deg) translateY(0);
            }

            50% {
                transform: rotate(-7deg) translateY(-10px);
            }
        }


        @keyframes go7Pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .78;
                transform: scale(1.04);
            }
        }


        @keyframes go7Dots {

            0%,
            100% {
                opacity: .45;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(-5px);
            }
        }


        @keyframes go7Bar1 {

            from {
                transform: scaleY(.82);
            }

            to {
                transform: scaleY(1);
            }
        }


        @keyframes go7Bar2 {

            from {
                transform: scaleY(.76);
            }

            to {
                transform: scaleY(1);
            }
        }


        @keyframes go7Bar3 {

            from {
                transform: scaleY(.70);
            }

            to {
                transform: scaleY(1);
            }
        }


        @keyframes go7Bar4 {

            from {
                transform: scaleY(.65);
            }

            to {
                transform: scaleY(1);
            }
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 991px) {

            .go7-home {
                padding: 40px 0;
            }

            .go7-right {
                min-height: auto;
                margin-top: 30px;
            }

            .go7-svg-art {
                max-width: 700px;
            }
        }


        @media (max-width: 767px) {

            .go7-home {
                padding: 35px 20px 45px;
            }

            .go7-left {
                text-align: center;
            }

            .go7-left .go7-description {
                margin-left: auto;
                margin-right: auto;
            }

            .go7-right {
                margin-top: 20px;
            }

            .go7-svg-art {
                max-width: 100%;
            }
        }


        @media (prefers-reduced-motion: reduce) {

            .go7-svg-art * {
                animation: none !important;
            }

        }

    </style>

</head>
