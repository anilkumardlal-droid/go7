  <style>

    html,
    body{
      margin:0;
      padding:0;
      min-height:100%;
    }

    body{
      background:#ffffff;
      color:#111827;
      font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }


    /* =========================
       HEADER
    ========================= */

    .go7-header{
      width:100%;
      padding:26px 0 0;
      position:relative;
      z-index:10;
    }

    .go7-logo{
      display:inline-flex;
      align-items:center;
    }

    .go7-logo img{
      height:44px;
      width:auto;
      display:block;
    }


    /* =========================
       HERO
    ========================= */

    .go7-hero{
      min-height:calc(100vh - 110px);
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;
      padding:35px 0 70px;
    }

    .go7-hero:before{
      content:"";
      position:absolute;
      width:600px;
      height:600px;
      right:-180px;
      top:40px;
      border-radius:50%;
      background:radial-gradient(
        circle,
        rgba(37,99,235,.075) 0%,
        rgba(219,234,254,.04) 45%,
        rgba(255,255,255,0) 72%
      );
      pointer-events:none;
    }

    .go7-hero:after{
      content:"";
      position:absolute;
      left:-160px;
      bottom:-350px;
      width:500px;
      height:500px;
      border-radius:50%;
      background:#f8fafc;
      pointer-events:none;
    }


    .go7-hero-inner{
      position:relative;
      z-index:2;
    }


    /* =========================
       LEFT CONTENT
    ========================= */

    .go7-copy{
      padding-right:25px;
    }

    .welcome-text{
      margin:0 0 24px;
      color:#64748b;
      font-size:15px;
      line-height:1.4;
      font-weight:600;
      letter-spacing:3px;
    }

    .go7-copy h1{
      margin:0;
      max-width:650px;
      color:#111827;
      font-size:clamp(43px,5vw,70px);
      line-height:1.05;
      letter-spacing:-2.8px;
      font-weight:650;
    }

    .go7-tagline{
      margin:22px 0 0;
      color:#64748b;
      font-size:21px;
      line-height:1.5;
      font-weight:400;
    }

    .go7-description{
      max-width:610px;
      margin:18px 0 32px;
      color:#8492a6;
      font-size:16px;
      line-height:1.7;
    }


    /* =========================
       BUTTON
    ========================= */

    .go7-explore{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:13px;

      min-width:190px;
      height:52px;

      padding:0 25px;

      border-radius:8px;

      background:#111827;
      color:#ffffff !important;

      text-decoration:none !important;

      font-size:15px;
      font-weight:600;

      transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .go7-explore:hover{
      background:#000000;
      color:#ffffff !important;
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(15,23,42,.12);
    }

    .go7-explore i{
      font-size:19px;
      transition:transform .2s ease;
    }

    .go7-explore:hover i{
      transform:translateX(4px);
    }


    /* =========================
       RIGHT ILLUSTRATION
    ========================= */

    .go7-visual{
      position:relative;
      width:100%;
      max-width:650px;
      margin-left:auto;
    }

    .go7-visual svg{
      width:100%;
      height:auto;
      display:block;
      overflow:visible;
    }


    /* soft floating animation */

    .go7-float{
      animation:go7Float 5s ease-in-out infinite;
      transform-origin:center;
    }

    .go7-float-slow{
      animation:go7FloatSlow 6s ease-in-out infinite;
      transform-origin:center;
    }

    @keyframes go7Float{
      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-7px);
      }
    }

    @keyframes go7FloatSlow{
      0%,100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(5px);
      }
    }


    /* =========================
       DOMAIN TAG
    ========================= */

    .domain-tag{
      animation:tagFloat 4s ease-in-out infinite;
      transform-origin:center;
    }

    @keyframes tagFloat{
      0%,100%{
        transform:rotate(-8deg) translateY(0);
      }

      50%{
        transform:rotate(-6deg) translateY(-6px);
      }
    }


    /* =========================
       FOOTER
    ========================= */

    .go7-footer{
      position:relative;
      z-index:5;
      padding:0 0 22px;
    }

    .go7-footer p{
      margin:0;
      color:#94a3b8;
      font-size:13px;
      line-height:1.7;
    }

    .go7-footer a{
      color:#64748b;
      text-decoration:none;
    }

      color:#111827;
    }

       TABLET
    ========================= */

    @media(max-width:991px){

      .go7-hero{

      }

      .go7-visual{

      }

      .go7-copy{
        text-align:left;
      }

      .welcome-text{

        letter-spacing:2.5px;
        margin-bottom:19px;
      }

      .go7-copy h1{
        font-size:43px;
        line-height:1.08;
        letter-spacing:-1.8px;
      }

      .go7-tagline{
        font-size:18px;

      }

        margin-bottom:28px;
      }

      .go7-explore{

      }

        max-width:570px;
      }

      .go7-footer{
        padding-bottom:18px;
      }

      .go7-footer p{
        font-size:12px;
        padding:0 12px;
      }

    }


    @media(max-width:480px){

      }

      }
