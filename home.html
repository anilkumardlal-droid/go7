    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        .go7-home {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            padding: 55px 0 45px;
            overflow: hidden;
        }

        .go7-home-row {
            align-items: center;
        }

        .go7-copy {
            position: relative;
            z-index: 2;
        }

        .go7-copy .welcome-text {
            margin-bottom: 20px;
        }

        .go7-copy h1 {
            margin: 0;
            font-size: clamp(42px, 5vw, 68px);
            line-height: 1.05;
            letter-spacing: -2.5px;
            font-weight: 650;
        }

        .go7-copy .go7-tagline {
            margin: 20px 0 0;
            font-size: 19px;
            line-height: 1.6;
        }

        .go7-copy .go7-description {
            max-width: 610px;
            margin: 16px 0 30px;
            font-size: 15px;
            line-height: 1.7;
        }

        .go7-explore {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            height: 48px;
            padding: 0 24px;
            border-radius: 8px;
            background: #111827;
            color: #fff !important;
            text-decoration: none !important;
            font-size: 15px;
            font-weight: 600;
            transition: .2s ease;
        }

        .go7-explore:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .go7-explore i {
            font-size: 17px;
        }

        .go7-visual {
            position: relative;
            width: 100%;
            min-height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .go7-visual svg {
            width: 100%;
            max-width: 760px;
            height: auto;
            display: block;
            transform: scale(1.08);
            transform-origin: center center;
        }

        @media (max-width: 991px) {
            .go7-home {
                padding: 45px 0 40px;
            }

            .go7-visual {
                min-height: auto;
                margin-top: 35px;
            }

            .go7-visual svg {
                max-width: 700px;
                transform: scale(1);
            }
        }

        @media (max-width: 767px) {
            .go7-home {
                padding: 35px 20px 40px;
            }

            .go7-copy {
                text-align: center;
            }

            .go7-copy .go7-description {
                margin-left: auto;
                margin-right: auto;
            }

            .go7-visual {
                margin-top: 25px;
            }

            .go7-visual svg {
                max-width: 100%;
            }
        }

        @media (max-width: 576px) {
            .go7-copy h1 {
                font-size: 42px;
                letter-spacing: -1.8px;
            }

            .go7-copy .go7-tagline {
                font-size: 17px;
            }

            .go7-copy .go7-description {
                font-size: 14px;
            }

            .go7-visual {
                margin-top: 15px;
            }
        }
